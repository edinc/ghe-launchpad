# Weekly dependency updates, grouped so they arrive as a few pull requests.
version: 2
updates:
  # package-lock.json carries no registry URLs (see .npmrc), so updates come from the public npm registry.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check doesn't support TypeScript 7 yet. Remove this once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'starlight-*']
      tests:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@axe-core/*', 'happy-dom']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']

  - package-ecosystem: github-actions
    directory: /
    # Generated by `gh aw compile`: its actions are updated by upgrading gh-aw (see AGENTS.md).
    exclude-paths: ['.github/workflows/*.lock.yml']
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
